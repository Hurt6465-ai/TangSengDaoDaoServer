openapi: 3.0.0
info:
  title: Open Topic Chatrooms
  version: 1.2.0
paths:
  /v1/chatrooms/list:
    get:
      summary: List active open topic chatrooms
  /v1/chatrooms/create:
    post:
      summary: Create an open topic chatroom
      description: Supports create_request_no for idempotent retries.
  /v1/chatrooms/enter:
    post:
      summary: Enter a topic chatroom and mark it read
  /v1/chatrooms/read:
    post:
      summary: Mark a joined topic chatroom read
  /v1/chatrooms/pin:
    post:
      summary: Pin or unpin a topic chatroom
      description: Administrator only.
  /v1/chatrooms/delete:
    post:
      summary: Delete a topic chatroom
      description: Creator or administrator only.
