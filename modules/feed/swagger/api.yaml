openapi: 3.0.0
info:
  title: TangSengDaoDao Feed API
  version: 1.0.0
  description: 发现动态、时间流、关注、互动与 TikTok 预览接口。
paths:
  /v1/feed/timeline:
    get:
      summary: 获取最新动态时间流
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 12, minimum: 1, maximum: 20}}
        - {name: cursor, in: query, schema: {type: string}, description: 上一页返回的不透明游标}
      responses:
        '200': {description: OK}
  /v1/feed/timeline/following:
    get:
      summary: 获取关注动态时间流
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 12, minimum: 1, maximum: 20}}
        - {name: cursor, in: query, schema: {type: string}, description: 上一页返回的不透明游标}
      responses:
        '200': {description: OK}
  /v1/feed/tiktok/preview:
    post:
      summary: 解析 TikTok 链接并返回封面预览
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string}
      responses:
        '200': {description: OK}
  /v1/feed/recommend:
    get:
      summary: 获取旧版推荐动态，兼容旧客户端
      responses:
        '200': {description: OK}
  /v1/feed/following:
    get:
      summary: 获取旧版关注动态，兼容旧客户端
      responses:
        '200': {description: OK}
  /v1/feed/user/{uid}:
    get:
      summary: 获取指定用户的动态
      parameters:
        - {name: uid, in: path, required: true, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: limit, in: query, schema: {type: integer, default: 20}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: OK}
  /v1/feed/publish:
    post:
      summary: 发布图片或 TikTok 动态
      responses:
        '200': {description: OK}
  /v1/feed/follow:
    post:
      summary: 关注用户
      responses:
        '200': {description: OK}
    delete:
      summary: 取消关注用户
      responses:
        '200': {description: OK}
  /v1/feed/{feed_id}/comments:
    get:
      summary: 获取动态评论
      parameters:
        - {name: feed_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
    post:
      summary: 发布动态评论或回复
      parameters:
        - {name: feed_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
  /v1/feed/{feed_id}/like:
    post:
      summary: 设置或切换点赞状态
      parameters:
        - {name: feed_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
  /v1/feed/{feed_id}/share:
    post:
      summary: 记录分享
      parameters:
        - {name: feed_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
  /v1/feed/{feed_id}/report:
    post:
      summary: 举报动态
      parameters:
        - {name: feed_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
  /v1/feed/{feed_id}/event:
    post:
      summary: 旧版行为事件上报，兼容旧客户端
      parameters:
        - {name: feed_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
  /v1/feed/{feed_id}:
    delete:
      summary: 删除自己的动态
      parameters:
        - {name: feed_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
